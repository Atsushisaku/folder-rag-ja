[project]
name = "folder-rag-ja"
version = "0.1.0"
description = "Local RAG chat over a folder of documents (Ollama + hybrid search)"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.3",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "streamlit>=1.65.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
